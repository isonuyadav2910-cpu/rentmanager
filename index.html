<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentManager • 11 Rooms</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#182230}header{background:#172033;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0 0 5px;font-size:23px}.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0000000d;border:1px solid #e4e9f0}.stat{font-size:25px;font-weight:800}.muted{color:#6b7280;font-size:13px}.room h3{margin:0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.paid{background:#dcfce7;color:#166534}.due{background:#fef3c7;color:#92400e}.overdue{background:#fee2e2;color:#991b1b}.vacant{background:#e5e7eb;color:#374151}.btn{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700;margin:3px 2px}.blue{background:#2563eb;color:#fff}.gray{background:#e5e7eb}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.orange{background:#f59e0b;color:#fff}input,select,textarea{width:100%;padding:9px;border:1px solid #d7dde5;border-radius:8px;margin-top:5px;margin-bottom:10px}label{font-size:13px;font-weight:700}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin:22px 0}.members{margin:8px 0;padding-left:18px}.actions{margin-top:8px}.topactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modalbox{background:#fff;border-radius:14px;padding:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}
</style></head><body>
<header><div class="wrap" style="padding:0"><h1>🏠 RentManager • 11 Rooms</h1><div class="muted" style="color:#cbd5e1">Rent • Tenants • Members • SMS • Expenses • Balance Sheet</div><div class="topactions"><button class="btn blue" onclick="installApp()">📲 Install App</button><button class="btn gray" onclick="notifyPermission()">🔔 Enable Alerts</button><button class="btn gray" onclick="backup()">⬇ Backup</button><button class="btn gray" onclick="restore()">⬆ Restore</button><button class="btn green" onclick="openExpense()">⚡ Add Expense</button></div></div></header>
<main class="wrap">
<section class="grid">
<div class="card"><div class="muted">Rent Income</div><div id="income" class="stat">₹0</div></div>
<div class="card"><div class="muted">Expenses</div><div id="expense" class="stat">₹0</div></div>
<div class="card"><div class="muted">Net Balance</div><div id="balance" class="stat">₹0</div></div>
<div class="card"><div class="muted">Occupied Rooms</div><div id="occupied" class="stat">0 / 11</div></div>
</section>
<section class="section card"><h2>📊 Accounts</h2><div class="twocol"><label>Year<select id="year" onchange="render()"></select></label><div><div class="muted">This year's income / expense</div><b id="yearSummary"></b></div></div></section>
<section class="section"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🏠 Rooms</h2><button class="btn blue" onclick="openRoom()">＋ Add / Edit Room</button></div><div id="rooms" class="grid"></div></section>
<section class="section card"><h2>💸 Expense History</h2><div id="expenses"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY="rentmanager_rebuilt_v1";
let db=JSON.parse(localStorage.getItem(KEY)||"null");
const nowY=new Date().getFullYear();
if(!db) db={rooms:Array.from({length:11},(_,i)=>({id:i+1,room:i+1,tenant:"",phone:"",rent:0,dueDay:5,status:"vacant",checkin:"",checkout:"",members:[],reminderDays:3,reminderEnabled:true,payments:[]})),expenses:[]};
db.rooms.forEach(r=>{r.members=Array.isArray(r.members)?r.members:[]; if(r.tenant&&!r.members.includes(r.tenant))r.members.unshift(r.tenant); r.payments=r.payments||[];});
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function ym(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function selectedStatus(r){if(!r.tenant)return "vacant";if(r.status==="paid")return "paid";let today=new Date().getDate();return today>Number(r.dueDay||5)?"overdue":"due"}
function sms(phone,msg){if(!phone){alert("Add the primary tenant phone number first.");return}location.href="sms:"+phone+"?body="+encodeURIComponent(msg)}
function rentReminder(r,overdue=false){return overdue?`Dear ${r.tenant}, your monthly rent of ${money(r.rent)} for Room ${r.room} is overdue. Please make the payment at the earliest. Thank you.`:`Dear ${r.tenant}, this is a reminder that your monthly rent of ${money(r.rent)} for Room ${r.room} is due on the ${r.dueDay}th. Please make the payment on time. Thank you.`}
function paidSms(r){sms(r.phone,`Dear ${r.tenant}, your rent payment of ${money(r.rent)} for Room ${r.room} has been received. Thank you.`)}
function reminderSms(r){sms(r.phone,rentReminder(r,selectedStatus(r)==="overdue"))}
function markPaid(id){let r=db.rooms.find(x=>x.id===id);if(!r)return;r.status="paid";r.payments.push({date:new Date().toISOString(),amount:Number(r.rent)||0});save();render();paidSms(r)}
function openRoom(id){let r=id?db.rooms.find(x=>x.id===id):db.rooms.find(x=>!x.tenant)||db.rooms[0];modal(`<h2>Room ${r.room}</h2><label>Primary Tenant Name<input id="tenant" value="${esc(r.tenant)}"></label><label>Primary Tenant Phone<input id="phone" value="${esc(r.phone)}" placeholder="10 digit mobile"></label><div class="twocol"><label>Monthly Rent<input id="rent" type="number" value="${r.rent||0}"></label><label>Due Day<input id="due" type="number" min="1" max="31" value="${r.dueDay||5}"></label></div><div class="twocol"><label>Check-in<input id="checkin" type="date" value="${r.checkin||""}"></label><label>Check-out<input id="checkout" type="date" value="${r.checkout||""}"></label></div><label>Members / Occupants — one name per line<textarea id="members" rows="5" placeholder="Rahul Sharma&#10;Amit Patel">${esc((r.members||[]).join("\\n"))}</textarea></label><div class="twocol"><label>Reminder days before due<input id="reminder" type="number" min="0" max="15" value="${r.reminderDays??3}"></label><label>Reminder enabled<select id="enabled"><option value="1" ${r.reminderEnabled!==false?"selected":""}>Yes</option><option value="0" ${r.reminderEnabled===false?"selected":""}>No</option></select></label></div><button class="btn blue" onclick="saveRoom(${r.id})">Save Room</button><button class="btn gray" onclick="closeModal()">Cancel</button>`)}
function saveRoom(id){let r=db.rooms.find(x=>x.id===id);r.tenant=document.getElementById("tenant").value.trim();r.phone=document.getElementById("phone").value.trim();r.rent=Number(document.getElementById("rent").value)||0;r.dueDay=Math.max(1,Math.min(31,Number(document.getElementById("due").value)||5));r.checkin=document.getElementById("checkin").value;r.checkout=document.getElementById("checkout").value;r.members=document.getElementById("members").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(r.tenant&&!r.members.includes(r.tenant))r.members.unshift(r.tenant);r.reminderDays=Math.max(0,Math.min(15,Number(document.getElementById("reminder").value)||3));r.reminderEnabled=document.getElementById("enabled").value==="1";r.status=r.tenant?(r.status==="paid"?"paid":"due"):"vacant";save();closeModal();render()}
function openExpense(){modal(`<h2>Add Property Expense</h2><p class="muted">Light bill is your expense only — it is NOT charged to a tenant.</p><label>Type<select id="etype"><option>Light Bill</option><option>Maintenance</option><option>Repair</option><option>Water</option><option>Other</option></select></label><div class="twocol"><label>Amount<input id="eamt" type="number"></label><label>Date<input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><label>Description<input id="edesc"></label><button class="btn green" onclick="saveExpense()">Save Expense</button><button class="btn gray" onclick="closeModal()">Cancel</button>`)}
function saveExpense(){db.expenses.push({type:document.getElementById("etype").value,amount:Number(document.getElementById("eamt").value)||0,date:document.getElementById("edate").value,description:document.getElementById("edesc").value});save();closeModal();render()}
function modal(x){document.getElementById("modalbox").innerHTML=x;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function render(){let y=Number(document.getElementById("year").value||nowY);let income=0,expense=0;db.rooms.forEach(r=>(r.payments||[]).forEach(p=>{if(new Date(p.date).getFullYear()===y)income+=Number(p.amount)||0}));db.expenses.forEach(e=>{if(new Date(e.date).getFullYear()===y)expense+=Number(e.amount)||0});document.getElementById("income").textContent=money(income);document.getElementById("expense").textContent=money(expense);document.getElementById("balance").textContent=money(income-expense);document.getElementById("occupied").textContent=db.rooms.filter(r=>r.tenant).length+" / 11";document.getElementById("yearSummary").textContent=money(income)+" income • "+money(expense)+" expenses • "+money(income-expense)+" net";
document.getElementById("rooms").innerHTML=db.rooms.map(r=>{let s=selectedStatus(r),mem=r.members||[];return `<div class="card room"><h3>Room ${r.room} <span class="badge ${s}">${s.toUpperCase()}</span></h3><p><b>${esc(r.tenant)||"Vacant"}</b><br>📞 ${esc(r.phone)||"—"}<br>💰 ${money(r.rent)} / month • Due ${r.dueDay}th</p>${mem.length?`<div><b>👥 ${mem.length} member${mem.length>1?"s":""}</b><ul class="members">${mem.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}<div class="muted">Check-in: ${r.checkin||"—"} • Check-out: ${r.checkout||"—"}</div><div class="actions"><button class="btn blue" onclick="openRoom(${r.id})">Edit</button>${r.tenant?`<button class="btn orange" onclick="reminderSms(db.rooms.find(x=>x.id===${r.id}))">📱 Rent Reminder</button><button class="btn green" onclick="markPaid(${r.id})">✅ Paid + SMS</button>`:""}</div></div>`}).join("");
document.getElementById("expenses").innerHTML=db.expenses.length?`<table class="table"><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th></tr>${db.expenses.slice().reverse().map((e,i)=>`<tr><td>${esc(e.date)}</td><td>${esc(e.type)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td></tr>`).join("")}</table>`:"<p class='muted'>No expenses recorded.</p>"}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rentmanager-backup.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let f=i.files[0],r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();location.reload()}catch(e){alert("Invalid backup file")}};r.readAsText(f)};i.click()}
async function notifyPermission(){if("Notification"in window){let p=await Notification.requestPermission();alert(p==="granted"?"Alerts enabled.":"Notifications not enabled.")}else alert("Notifications are not supported by this browser.")}
async function installApp(){if(window.deferredPrompt){window.deferredPrompt.prompt();window.deferredPrompt=null}else alert("To install: open this site in Chrome/Edge and choose Install App / Add to Home screen.")}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.deferredPrompt=e});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
let ys=document.getElementById("year");for(let y=nowY-5;y<=nowY+2;y++)ys.innerHTML+=`<option>${y}</option>`;ys.value=nowY;render();
</script></body></html>
