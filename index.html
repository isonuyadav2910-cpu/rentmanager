<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentManager Pro - 11 Rooms</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
header{
  background:#172033;
  color:white;
  padding:16px 20px;
}
header h1{margin:0;font-size:22px}
nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:12px;
  background:white;
  border-bottom:1px solid #ddd;
}
button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.orange{background:#ea580c;color:white}
.secondary{background:#e5e7eb;color:#111}
.navbtn{background:#eef2ff;color:#1e3a8a}
.navbtn.active{background:#2563eb;color:white}

main{max-width:1300px;margin:auto;padding:18px}
.view{display:none}
.view.active{display:block}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}
.card{
  background:white;
  border:1px solid #e5e9f0;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 8px #00000008;
}
.stat{
  font-size:24px;
  font-weight:bold;
  margin-top:6px;
}
.muted{
  color:#687386;
  font-size:13px;
}
.sectionhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
}
label{
  display:block;
  font-size:13px;
  color:#687386;
  margin-bottom:5px;
}
input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccd3df;
  border-radius:8px;
  font:inherit;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}
th,td{
  padding:10px;
  border-bottom:1px solid #e5e9f0;
  text-align:left;
  font-size:14px;
}
th{background:#f8fafc}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:99px;
  font-size:12px;
  background:#dcfce7;
  color:#166534;
}
.badge.red{
  background:#fee2e2;
  color:#991b1b;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.room-card h3{margin-top:0}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  padding:15px;
  overflow:auto;
}
.modal.show{display:block}
.modalbox{
  max-width:850px;
  margin:30px auto;
  background:white;
  border-radius:16px;
  padding:20px;
}

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.loginbox{
  width:100%;
  max-width:420px;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 30px #0002;
}
.login-tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}
.login-tabs button{flex:1}

.hidden{display:none!important}

.notice{
  padding:12px;
  background:#eff6ff;
  border-radius:10px;
  margin-bottom:15px;
}

.savebar{
  position:sticky;
  top:0;
  z-index:5;
  background:white;
  padding:10px;
  border-bottom:1px solid #ddd;
  margin:-18px -18px 18px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
}

#saveMessage{
  color:#16a34a;
  font-weight:bold;
  display:none;
}

@media(max-width:600px){
  main{padding:10px}
  .grid{grid-template-columns:1fr}
  table{
    display:block;
    overflow-x:auto;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login">

<div class="loginbox">

<h1 style="text-align:center">RentManager</h1>

<p class="muted" style="text-align:center">
11 Room Rental Management
</p>

<div class="login-tabs">

<button id="ownerTab"
class="primary"
onclick="setLoginType('owner')">
Owner Login
</button>

<button id="renterTab"
class="secondary"
onclick="setLoginType('renter')">
Renter Login
</button>

</div>

<div id="loginError"
style="color:#dc2626;margin-bottom:10px">
</div>

<!-- OWNER LOGIN -->

<div id="ownerLoginFields">

<label>Owner Gmail</label>

<input
